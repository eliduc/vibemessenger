services:
  messenger:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: messenger-api
    restart: unless-stopped
    ports:
      - "8443:8000"
    environment:
      - MESSENGER_DEBUG=false
      - MESSENGER_DATABASE_URL=postgresql+asyncpg://messenger:${DB_PASSWORD}@postgres:5432/messenger
      - MESSENGER_SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messenger-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: messenger-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=messenger
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=messenger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - messenger-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: messenger-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-client:/usr/share/nginx/html:ro
    depends_on:
      - messenger
    networks:
      - messenger-net

  coturn:
    image: coturn/coturn:latest
    container_name: messenger-turn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  postgres_data:

networks:
  messenger-net:
    driver: bridge
