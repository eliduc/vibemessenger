# Coturn TURN Server Configuration
# For WebRTC NAT traversal

# Network settings
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Relay settings
min-port=49152
max-port=65535

# Authentication
use-auth-secret
static-auth-secret=1c626b0c0eff0051b5ab7d79df8df944
realm=your.domain.com

# Logging
verbose
log-file=/var/log/coturn/turnserver.log

# Performance (optimized for Raspberry Pi)
proc-quota=10
bps-capacity=0
total-quota=100

# Security
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Allow only UDP relay (saves CPU on Pi)
no-tcp-relay

# Fingerprint for STUN
fingerprint

# STUN only mode (no relay) - uncomment for testing
# stun-only
